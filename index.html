<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QR Recast" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>QR Recast</title>
    <style id="fallback-shell">
      #root > div {
        background: #f5fbf8;
        color: #173b35;
      }
      #root > div p {
        color: #48645e;
      }
      @media (prefers-color-scheme: dark) {
        #root > div {
          background: #0a1413;
          color: #e8f1ee;
        }
        #root > div p {
          color: #a2b4af;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100svh;
          display: grid;
          place-items: center;
          padding: 24px;
          font-family: system-ui, sans-serif;
        "
      >
        <main style="width: min(100%, 360px); display: grid; gap: 18px; text-align: center">
          <img
            alt=""
            aria-hidden="true"
            src="%BASE_URL%favicon.svg"
            style="width: 56px; height: 56px; margin: 0 auto; border-radius: 14px"
          />
          <section style="display: grid; gap: 8px">
            <h1 style="margin: 0; font-size: 2rem; line-height: 1.1">Point at a QR code</h1>
            <p style="margin: 0; color: #48645e">
              Start the camera, then line up a QR code in the frame.
            </p>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
