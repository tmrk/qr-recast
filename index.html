<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EFEEE7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QR Recast" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Restore photographed QR codes as crisp, private, scan-ready files on your device."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>QR Recast</title>
    <style id="fallback-shell">
      .preboot-shell {
        background: #efeee7;
        color: #18201e;
      }
      .preboot-shell p {
        color: #52605c;
      }
      @media (prefers-color-scheme: dark) {
        .preboot-shell {
          background: #0d1210;
          color: #edf2ef;
        }
        .preboot-shell p {
          color: #aab6b1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="preboot-shell"
        style="
          min-height: 100svh;
          display: grid;
          place-items: center;
          padding: 24px;
          font-family: system-ui, sans-serif;
        "
      >
        <main style="width: min(100%, 360px); display: grid; gap: 18px; text-align: center">
          <img
            alt=""
            aria-hidden="true"
            src="%BASE_URL%favicon.svg"
            style="width: 56px; height: 56px; margin: 0 auto; border-radius: 14px"
          />
          <section style="display: grid; gap: 8px">
            <h1 style="margin: 0; font-size: 2rem; line-height: 1.1">Point at a QR code</h1>
            <p style="margin: 0">
              Restore it as crisp SVG, PNG, PDF, or Word artwork — entirely on this device.
            </p>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
